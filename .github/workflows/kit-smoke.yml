name: Ed-Fi API v8 kit smoke test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ed-fi-api-v8/**'
      - '.github/workflows/kit-smoke.yml'
  schedule:
    # 06:17 UTC daily
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck - host scripts
        working-directory: ed-fi-api-v8
        run: >
          shellcheck -x
          start.sh stop.sh reset.sh bootstrap.sh new-credential.sh smoke-test.sh
          scripts/lib.sh ssl/generate-certificate.sh

      - name: shellcheck - container init scripts
        working-directory: ed-fi-api-v8/init
        run: shellcheck --shell=sh -x -- *.sh

      - name: shellcheck - tools and nginx entrypoint scripts
        working-directory: ed-fi-api-v8
        run: shellcheck tools/bulkloadclient.sh nginx/entrypoint.d/40-kit-features.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer
    # Deliberately pinned to @main rather than a SHA to always use the latest version of this
    # reusable workflow that we maintain
    uses: ed-fi-alliance-oss/ed-fi-actions/.github/workflows/powershell-analyzer.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read

  kit-smoke-minimal:
    name: Kit smoke test (minimal template)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Budget: the README/spike-notes measure a clean minimal `up` in roughly a minute of load time,
    # but a CI runner also pays for every image pull and the tools image's from-scratch build
    # (dotnet/sdk-based) on every run, with no layer cache carried over between runs. 20 minutes
    # leaves generous headroom over that for a job that should normally finish in a few minutes.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the TLS certificate
        run: ./ed-fi-api-v8/ssl/generate-certificate.sh

      - name: Start the kit (minimal template)
        run: ./ed-fi-api-v8/start.sh --template minimal

      - name: Run the smoke test
        run: ./ed-fi-api-v8/smoke-test.sh

      # From here on, run regardless of whether the steps above succeeded, so a failure is
      # debuggable from the Actions UI without re-running anything.
      - name: Collect docker compose logs
        if: always()
        working-directory: ed-fi-api-v8
        run: docker compose logs --no-color --timestamps > compose-logs.txt 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-smoke-logs-minimal
          path: |
            ed-fi-api-v8/logs/
            ed-fi-api-v8/compose-logs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down the stack
        if: always()
        run: ./ed-fi-api-v8/reset.sh --force

  kit-smoke-populated:
    name: Kit smoke test (populated template)
    # This is an expensive job - do not run it on every pull request
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Budget: the README/spike-notes measure a clean populated `up` at about 200s (around 3.3
    # minutes) of load time on a spike host, and about 8 minutes for the whole clean stack
    # end-to-end there. A CI runner also pays for image pulls and the tools image build on every
    # run (see the minimal job's comment), so 30 minutes leaves generous headroom over the
    # measured figures instead of guessing a number.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the TLS certificate
        run: ./ed-fi-api-v8/ssl/generate-certificate.sh

      - name: Start the kit (populated template)
        run: ./ed-fi-api-v8/start.sh --template populated

      - name: Run the smoke test
        run: ./ed-fi-api-v8/smoke-test.sh

      - name: Collect docker compose logs
        if: always()
        working-directory: ed-fi-api-v8
        run: docker compose logs --no-color --timestamps > compose-logs.txt 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-smoke-logs-populated
          path: |
            ed-fi-api-v8/logs/
            ed-fi-api-v8/compose-logs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down the stack
        if: always()
        run: ./ed-fi-api-v8/reset.sh --force
